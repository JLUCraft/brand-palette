name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/brand-palette
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/brand-palette

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/federated-skinstation
          path: workspace/federated-skinstation

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/website
          path: workspace/jlucraft-web

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/FollyLauncher
          ref: folly
          path: workspace/FollyLauncher

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/union-manager
          path: workspace/union-manager

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Check generated brand consumers
        run: bun run check:consumers
